<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Hub — Web Workers</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <div class="logo">IT Hub</div>
            <div class="student-name">Губенко Сергей</div>
        </div>
    </header>

    <nav class="site-nav">
        <div class="nav-inner">
            <div class="nav-links">
                <a href="index.html">Главная</a>
                <a href="graphics.html">Графика и Анимация</a>
                <a href="workers.html" class="active">Web Workers</a>
            </div>
            <div class="nav-history">
                <button class="btn-history" type="button" onclick="history.back()">Назад</button>
                <button class="btn-history" type="button" onclick="history.forward()">Вперёд</button>
            </div>
        </div>
    </nav>

    <main>
        <h1 class="page-title">Web Workers</h1>
        <p class="page-subtitle">Вычисление факториалов в фоновом потоке</p>

        <div class="worker-layout">
            <div class="worker-form">
                <div class="field-group">
                    <label class="field-label" for="n-input">Введите натуральное число N:</label>
                    <input type="number" id="n-input" min="1" max="1000" step="1" value="5" placeholder="например, 10">
                    <button class="btn btn-primary" id="run-btn" type="button">Вывести</button>
                    <button class="btn" id="stop-btn" type="button" disabled>Остановить</button>
                </div>
                <p class="worker-status" id="worker-status" aria-live="polite">Готов к работе.</p>
            </div>

            <div class="console-toolbar">
                <span class="console-title">Консоль</span>
                <button class="btn" id="clear-console" type="button">Очистить консоль</button>
            </div>

            <div id="console" contenteditable="false" spellcheck="false" readonly></div>
        </div>
    </main>

    <script src="js/workers.js"></script>
</body>
</html>
